<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGAS - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark" style="background-color: #1a365d;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">SEDALIB <span
                    class="fw-normal fs-6 ms-2 text-light opacity-75">SIGAS | Atención y seguimiento</span></a>
            <a th:href="@{/consulta}" class="btn" style="background-color: #0d9488; color: white;">Consultar Estado</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <h2 class="fw-bold" style="color: #1a365d;">Registra una solicitud</h2>
                <p class="text-muted mb-4">Cuéntanos qué ocurre y guarda tu código para hacer seguimiento.</p>

                <form th:action="@{/registro}" th:object="${solicitud}" method="POST"
                    class="bg-white p-4 rounded shadow-sm border border-light">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Nombre del solicitante</label>
                            <input type="text" class="form-control bg-light" th:field="*{nombreSolicitante}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Correo electrónico</label>
                            <input type="email" class="form-control bg-light" th:field="*{correo}" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Descripción de lo ocurrido</label>
                            <textarea class="form-control bg-light" th:field="*{descripcion}" rows="4"
                                required></textarea>
                        </div>
                        <div class="col-12 mt-4">
                            <button type="submit" class="btn px-4 py-2"
                                style="background-color: #0d9488; color: white;">Enviar solicitud</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal de Éxito -->
    <div class="modal fade" id="modalConfirmacion" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header text-white" style="background-color: #0d9488;">
                    <h5 class="modal-title">Solicitud Registrada</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center p-4">
                    <p>Tu solicitud ha sido procesada correctamente. Guarda este código:</p>
                    <h3 class="fw-bold" style="color: #1a365d;" th:text="${codigoSeguimiento}">SG-00000000</h3>
                </div>
                <div class="modal-footer justify-content-center bg-light">
                    <a th:href="@{/consulta}" class="btn" style="background-color: #1a365d; color: white;">Ir a
                        Consulta</a>
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Pasa la variable al JS -->
    <script th:inline="javascript">
        var codigoGenerado = /*[[${codigoSeguimiento}]]*/ null;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>

</html>
