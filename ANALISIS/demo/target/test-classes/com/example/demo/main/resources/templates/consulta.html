<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGAS - Consulta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark" style="background-color: #1a365d;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">SEDALIB <span
                    class="fw-normal fs-6 ms-2 text-light opacity-75">SIGAS | Atención y seguimiento</span></a>
            <a th:href="@{/registro}" class="btn btn-outline-light">Nuevo Registro</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h2 class="fw-bold" style="color: #1a365d;">Consulta el estado de tu solicitud</h2>
                <form th:action="@{/consulta}" method="POST" class="d-flex mt-4 gap-2">
                    <input type="text" name="codigo" class="form-control form-control-lg bg-white"
                        placeholder="Ej.: SG-2026-A1B2" th:value="${codigoBuscado}" required>
                    <button type="submit" class="btn btn-lg"
                        style="background-color: #0d9488; color: white;">Consultar</button>
                </form>

                <!-- Mensaje de Error (alerta de bootstrap) -->
                <div th:if="${error}" class="alert alert-danger mt-4" role="alert" th:text="${error}"></div>

                <!-- Tarjeta de Resultados -->
                <div th:if="${solicitudEncontrada}" class="card mt-4 border-0 shadow-sm">
                    <div class="card-body p-4">
                        <h4 class="fw-bold" style="color: #1a365d;">Solicitud <span
                                th:text="${solicitudEncontrada.codigoSeguimiento}"></span></h4>
                        <span class="badge rounded-pill mb-4 px-3 py-2"
                            style="background-color: #d1fae5; color: #065f46;"
                            th:text="${solicitudEncontrada.estado}"></span>

                        <div class="d-flex mb-3">
                            <div class="fw-bold me-4" style="color: #0d9488;"
                                th:text="${#temporals.format(solicitudEncontrada.fechaRegistro, 'dd/MM/yyyy HH:mm')}">
                            </div>
                            <div>Solicitud registrada en el sistema.</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
